[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-harvester"
version = "1.0.0"
description = "High-Frequency Adaptive Profit Retention & Convex Trailing Harvester for Crypto Perpetuals"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "dll61" }
]
requires-python = ">=3.8"
keywords = [
    "quantitative-finance",
    "trailing-stop",
    "hyperliquid",
    "crypto-trading",
    "hft",
    "market-microstructure",
    "profit-retention",
    "algorithmic-trading"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/dll61/convex-harvester"
Repository = "https://github.com/dll61/convex-harvester"
"Bug Tracker" = "https://github.com/dll61/convex-harvester/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

